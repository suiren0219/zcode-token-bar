[package]
name = "zcode-token-data"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "只读 ZCode 统计辅助程序，供 SSH 远端使用"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
